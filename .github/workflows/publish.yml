name: Publish Package to npm
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the repository
      id-token: write # to mint the OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Verify version matches between tag and package.json
      - name: Verify version
        run: |
          # Fail immediately if a command fails
          set -e
          # Extract version from git tag (remove 'v' prefix)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          # Check if package.json exists
          if [ ! -f "package.json" ]; then
            echo "Error: package.json not found"
            exit 1
          fi
          # Extract version from package.json and trim any whitespace
          PKG_VERSION=$(node -p "require('./package.json').version" | tr -d ' ')
          # Compare versions and fail if they don't match
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          else
            echo "✓ Version match confirmed: $TAG_VERSION"
          fi
      # Setup Node.js environment. Actions are pinned to commit SHAs (the
      # trailing comment records the release the SHA came from) so a moved
      # tag can't swap the code out from under us.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # no registry-url: it writes an _authToken placeholder to .npmrc,
          # which preempts the OIDC trusted-publishing flow (npm sends the
          # bogus token and the registry 404s the PUT)
          #
          # caching is off (setup-node turns it on by default whenever
          # package.json has a packageManager field): a dependency cache
          # restored into a release job is a poisoning path into the published
          # tarball, and this job runs a handful of times a year
          package-manager-cache: false
      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Run prepublishOnly script (clean, build, test)
      - name: Prepare package
        run: pnpm run prepublishOnly
      # Verify build output exists
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: Build output directory 'dist' does not exist"
            exit 1
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "Error: Build output missing, dist directory is empty"
            exit 1
          fi
          echo "✓ Build output verification successful"
      # Publish to npm via trusted publishing (OIDC) — no token needed.
      # npm cli directly, not pnpm publish: pnpm's delegation to npm loses
      # the OIDC exchange (ENEEDAUTH). npm@latest, since trusted publishing
      # needs >= 11.5.1.
      - name: Publish package to npm
        run: |
          npm install -g npm@12.0.2
          npm publish --access public
